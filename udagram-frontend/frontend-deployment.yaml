apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        service: frontend
        app: frontend
    spec:
      containers:
      - name: frontend
        image: mpsijben/udagram-frontend:latest
        ports:
        - containerPort: 80