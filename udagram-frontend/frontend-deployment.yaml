apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        service: frontend
        app: frontend
    spec:
      containers:
      - name: frontend
        image: mpsijben/udagram-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"  
            cpu: "50m"    
          limits:
            memory: "128Mi"
            cpu: "100m" 